[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ucp"
version = "1.0.0"
description = "Universal Commerce Protocol (UCP) & Agentic Purchasing Engine for Python & FastAPI"
readme = "README.md"
authors = [{ name = "Jalen", email = "contact@nymrel.com" }]
license = { text = "MIT" }
keywords = ["ucp", "universal-commerce-protocol", "agentic-purchasing", "ai-agents", "x402", "ap2", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "starlette>=0.27.0"]

[project.scripts]
open-ucp = "open_ucp.cli:main"
