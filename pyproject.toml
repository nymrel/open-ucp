[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ucp"
version = "1.0.0"
description = "Universal Commerce Protocol (UCP) & Agentic Purchasing Engine for Python & FastAPI"
readme = "README.md"
authors = [{ name = "Jalen", email = "contact@nymrel.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ucp", "universal-commerce-protocol", "agentic-purchasing", "ai-agents", "x402", "ap2", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "starlette>=0.27.0"]

[project.scripts]
open-ucp = "open_ucp.cli:main"

[project.urls]
Homepage = "https://nymrel.com"
Repository = "https://github.com/nymrel/open-ucp"
Issues = "https://github.com/nymrel/open-ucp/issues"

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["python"]
include = ["open_ucp*"]
exclude = ["tests*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
